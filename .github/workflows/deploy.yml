name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Verify static directory
        run: |
          echo "Checking static/data:"
          ls -la static/data/ | head || echo "static/data/ does not exist"
          echo "---"
          echo "Checking build after vite:"
          ls -la build/

      - name: Build for GitHub Pages
        run: npm run build:preview

      - name: Verify build contents
        run: |
          echo "Build directory size:"
          du -sh build/
          echo "Build data directory:"
          ls -la build/data/ | head
          echo "Total files in build:"
          find build -type f | wc -l
          echo "Checking for symlinks:"
          find build -type l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
